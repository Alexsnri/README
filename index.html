<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nave — El marketplace de bienes raíces industriales</title>
<meta name="description" content="Encuentra, compara y renta bodegas, naves y espacios industriales verificados en México. Búsqueda, matching inteligente y comparador para empresas.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23151821'/%3E%3Cpath d='M6 21V13.5L16 8l10 5.5V21H6z' fill='none' stroke='%23ff5d2e' stroke-width='2' stroke-linejoin='round'/%3E%3Crect x='13' y='16' width='6' height='5' fill='%23ff5d2e'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14151a;--ink-2:#42454e;--ink-3:#767b87;--ink-4:#9ba0ac;
  --paper:#faf9f6;--surface:#ffffff;--surface-2:#f3f2ee;--line:#e7e5df;--line-2:#dad7cf;
  --accent:#ff5d2e;--accent-ink:#ffffff;--accent-soft:#fff0ea;--accent-dark:#c9430f;
  --navy:#10131c;--navy-2:#181d2b;
  --ok:#1c7c54;--ok-soft:#e7f5ee;--warn:#b45309;--warn-soft:#fdf1e0;--info:#2b5fd9;--info-soft:#eaf0fe;
  --r-sm:8px;--r-md:12px;--r-lg:18px;--r-xl:26px;
  --shadow-sm:0 1px 2px rgba(20,21,26,.06),0 1px 1px rgba(20,21,26,.04);
  --shadow-md:0 8px 24px rgba(20,21,26,.08),0 2px 6px rgba(20,21,26,.04);
  --shadow-lg:0 24px 60px rgba(15,17,25,.16),0 6px 18px rgba(15,17,25,.08);
  --fd:'Space Grotesk',sans-serif;--fb:'Inter',sans-serif;
  --maxw:1280px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font:400 15px/1.55 var(--fb);-webkit-font-smoothing:antialiased;overflow-x:hidden}
img,svg{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4,.disp{font-family:var(--fd);letter-spacing:-.01em;font-weight:600;line-height:1.1}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 28px}
@media(max-width:720px){.wrap{padding:0 18px}}
.vis-mobile{display:none!important}
@media(max-width:900px){.vis-mobile{display:block!important}.vis-desktop{display:none!important}}

/* ===== buttons ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font:600 13.5px var(--fb);transition:.16s ease;white-space:nowrap}
.btn:hover{border-color:var(--ink-3);transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.btn:active{transform:translateY(0)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{background:var(--accent-dark);border-color:var(--accent-dark);box-shadow:0 10px 24px rgba(255,93,46,.28)}
.btn.dark{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.dark:hover{background:#232939}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2);border-color:transparent}
.btn.sm{padding:7px 14px;font-size:12.5px}
.btn.lg{padding:15px 26px;font-size:15px}
.btn.block{width:100%}
.btn.icon-only{padding:9px;border-radius:999px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.ic{width:16px;height:16px;flex-shrink:0}
.ic-lg{width:20px;height:20px}

/* ===== nav ===== */
#nav{position:sticky;top:0;z-index:200;background:rgba(250,249,246,.86);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
#nav .bar{display:flex;align-items:center;gap:22px;height:72px}
.logo{display:flex;align-items:center;gap:9px;font:700 20px var(--fd);letter-spacing:-.02em;flex-shrink:0}
.logo .mk{width:34px;height:34px;border-radius:9px;background:var(--navy);display:grid;place-items:center}
.logo .mk svg{width:19px;height:19px}
#navLinks{display:flex;align-items:center;gap:4px;flex:1}
.nlk{padding:9px 13px;border-radius:8px;font:600 13.5px var(--fb);color:var(--ink-2);transition:.15s}
.nlk:hover{background:var(--surface-2);color:var(--ink)}
.nlk.on{color:var(--accent-dark);background:var(--accent-soft)}
#navRight{display:flex;align-items:center;gap:10px;flex-shrink:0}
.mode-toggle{display:flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px;border:1px solid var(--line)}
.mode-toggle button{padding:7px 13px;border-radius:999px;font:600 12px var(--fb);color:var(--ink-3);background:transparent;border:none}
.mode-toggle button.on{background:var(--navy);color:#fff}
.iconbtn{position:relative;width:38px;height:38px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);display:grid;place-items:center;transition:.15s}
.iconbtn:hover{border-color:var(--ink-3);background:var(--surface-2)}
.iconbtn .bdg{position:absolute;top:-4px;right:-4px;background:var(--accent);color:#fff;font:700 9.5px var(--fb);min-width:16px;height:16px;border-radius:10px;display:grid;place-items:center;padding:0 3px;border:2px solid var(--paper)}
.avatar-btn{width:38px;height:38px;border-radius:999px;background:linear-gradient(135deg,#2a3448,#171b26);color:#fff;display:grid;place-items:center;font:700 13px var(--fd);border:1px solid var(--line-2)}
#mobBurger{display:none}
@media(max-width:1080px){#navLinks{display:none}#mobBurger{display:grid}}

/* ===== dropdown / menus ===== */
.menu-wrap{position:relative}
.menu{position:absolute;top:calc(100% + 10px);right:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow-lg);min-width:230px;padding:8px;display:none;z-index:250}
.menu.open{display:block;animation:pop .16s ease}
@keyframes pop{from{opacity:0;transform:translateY(-6px)}}
.menu a,.menu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 11px;border-radius:8px;font:500 13.5px var(--fb);color:var(--ink-2);background:none;border:none}
.menu a:hover,.menu button:hover{background:var(--surface-2);color:var(--ink)}
.menu hr{border:none;border-top:1px solid var(--line);margin:6px 2px}

/* ===== hero ===== */
#hero{position:relative;background:var(--navy);color:#fff;overflow:hidden;padding:64px 0 0}
#hero .illu{position:absolute;inset:0;opacity:.55}
#hero .fade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(16,19,28,.35),rgba(16,19,28,.92) 78%,var(--paper) 100%)}
#hero .inner{position:relative;z-index:2;padding:64px 0 200px;text-align:center}
#hero h1{font-size:clamp(34px,5.6vw,64px);max-width:900px;margin:0 auto 18px}
#hero h1 span{color:#ffb199}
#hero p.sub{font:500 17px/1.5 var(--fb);color:#c7cbd6;max-width:560px;margin:0 auto 40px}
.pill-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:28px}
.pill-row .chip{padding:6px 14px;border:1px solid rgba(255,255,255,.18);border-radius:999px;font:600 12px var(--fb);color:#d6d9e2;background:rgba(255,255,255,.06)}

/* search bar */
.searchbar{background:var(--surface);border-radius:20px;box-shadow:var(--shadow-lg);display:grid;grid-template-columns:1.4fr 1fr 1fr auto;gap:0;max-width:920px;margin:0 auto;position:relative;z-index:3;text-align:left;color:var(--ink)}
.searchbar .sf{padding:14px 20px;border-right:1px solid var(--line);position:relative}
.searchbar .sf:last-of-type{border-right:none}
.searchbar .sf label{display:block;font:700 10px var(--fb);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:3px}
.searchbar .sf input,.searchbar .sf select{width:100%;border:none;outline:none;font:600 14px var(--fb);background:transparent;color:var(--ink)}
.searchbar .sf input::placeholder{color:var(--ink-4);font-weight:500}
.searchbar .gobtn{margin:8px;border-radius:14px;background:var(--accent);color:#fff;border:none;padding:0 26px;font:700 14px var(--fb);display:flex;align-items:center;gap:8px}
.searchbar .gobtn:hover{background:var(--accent-dark)}
@media(max-width:900px){.searchbar{grid-template-columns:1fr;border-radius:18px}.searchbar .sf{border-right:none;border-bottom:1px solid var(--line)}.searchbar .gobtn{margin:10px;height:46px;justify-content:center}}

.stat-strip{position:relative;z-index:3;max-width:920px;margin:26px auto 0;display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:1px solid rgba(255,255,255,.14)}
.stat-strip .st{padding:20px 10px;text-align:center;border-right:1px solid rgba(255,255,255,.14)}
.stat-strip .st:last-child{border-right:none}
.stat-strip b{display:block;font:700 24px var(--fd);color:#fff}
.stat-strip span{font:500 11.5px var(--fb);color:#a7acba}
@media(max-width:640px){.stat-strip{grid-template-columns:repeat(2,1fr)}.stat-strip .st{border-bottom:1px solid rgba(255,255,255,.14)}}

/* ===== sections ===== */
.section{padding:76px 0}
.section.tight{padding:44px 0}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:32px;flex-wrap:wrap}
.section-head h2{font-size:clamp(24px,3vw,34px)}
.section-head p{color:var(--ink-3);font-size:15px;margin-top:6px;max-width:520px}
.eyebrow{display:inline-flex;align-items:center;gap:7px;font:700 11px var(--fb);letter-spacing:.08em;text-transform:uppercase;color:var(--accent-dark);margin-bottom:10px}
.eyebrow::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--accent)}

/* ===== cards ===== */
.grid-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
@media(max-width:1200px){.grid-cards{grid-template-columns:repeat(3,1fr)}}
@media(max-width:860px){.grid-cards{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.grid-cards{grid-template-columns:1fr}}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;transition:.2s;position:relative;display:flex;flex-direction:column}
.pcard:hover{box-shadow:var(--shadow-md);transform:translateY(-3px);border-color:var(--line-2)}
.pcard .ph-wrap{position:relative}
.pcard .ph{position:relative;aspect-ratio:4/3;overflow:hidden;background:#eee}
.ph>svg{width:100%;height:100%;display:block}
.pcard .badges{position:absolute;top:10px;left:10px;display:flex;gap:6px;flex-wrap:wrap;max-width:80%}
.badge{font:700 10.5px var(--fb);padding:4px 9px;border-radius:999px;letter-spacing:.02em;display:inline-flex;align-items:center;gap:4px}
.badge.verified{background:#fff;color:var(--ok)}
.badge.featured{background:var(--navy);color:#fff}
.badge.avail{background:rgba(255,255,255,.94);color:var(--ink-2)}
.badge.imm{background:#e7f5ee;color:var(--ok)}
.savebtn{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:999px;background:rgba(20,21,26,.4);backdrop-filter:blur(3px);border:none;display:grid;place-items:center;transition:.15s}
.savebtn:hover{background:rgba(20,21,26,.6)}
.savebtn svg{width:16px;height:16px;stroke:#fff;fill:none}
.savebtn.on svg{fill:var(--accent);stroke:var(--accent)}
.pcard .pb{padding:15px 16px 17px;display:flex;flex-direction:column;gap:6px;flex:1}
.pcard .ptype{font:600 10.5px var(--fb);color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}
.pcard h3{font:600 16px var(--fd);line-height:1.25}
.pcard .ploc{font:500 12.5px var(--fb);color:var(--ink-3);display:flex;align-items:center;gap:5px}
.pcard .pspecs{display:flex;gap:12px;font:500 12px var(--fb);color:var(--ink-2);margin-top:2px;flex-wrap:wrap}
.pcard .pspecs b{color:var(--ink)}
.pcard .pfoot{margin-top:auto;padding-top:10px;border-top:1px solid var(--line);display:flex;align-items:baseline;justify-content:space-between}
.pcard .price{font:700 17px var(--fd)}
.pcard .price small{font:600 11px var(--fb);color:var(--ink-3)}
.pcard .pmonth{font:600 11.5px var(--fb);color:var(--ink-3)}
.pcard .cmpbtn{position:absolute;bottom:10px;left:10px;font:700 10.5px var(--fb);background:rgba(255,255,255,.95);padding:5px 10px;border-radius:999px;display:flex;align-items:center;gap:5px;border:1px solid var(--line-2)}
.pcard .cmpbtn.on{background:var(--navy);color:#fff;border-color:var(--navy)}

/* ===== how it works / trust ===== */
.hiw-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
@media(max-width:900px){.hiw-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.hiw-grid{grid-template-columns:1fr}}
.hiw-card{padding:26px 22px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface)}
.hiw-card .n{font:700 12px var(--fd);color:var(--accent-dark);margin-bottom:14px}
.hiw-card .ic-wrap{width:44px;height:44px;border-radius:12px;background:var(--accent-soft);display:grid;place-items:center;margin-bottom:16px;color:var(--accent-dark)}
.hiw-card h4{font-size:16px;margin-bottom:6px}
.hiw-card p{color:var(--ink-3);font-size:13.5px;line-height:1.5}

.trust-band{background:var(--navy);color:#fff;border-radius:var(--r-xl);padding:52px 44px;display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
@media(max-width:900px){.trust-band{grid-template-columns:1fr;padding:36px 24px}}
.trust-band h2{color:#fff;font-size:28px;margin-bottom:12px}
.trust-band p{color:#b8bcc8;font-size:14.5px;line-height:1.6;margin-bottom:20px}
.trust-list{display:flex;flex-direction:column;gap:14px}
.trust-item{display:flex;gap:12px;align-items:flex-start}
.trust-item .dot{width:30px;height:30px;border-radius:9px;background:rgba(255,93,46,.18);color:#ff9a75;display:grid;place-items:center;flex-shrink:0}
.trust-item b{display:block;font-size:14px;margin-bottom:2px}
.trust-item span{color:#a7acba;font-size:12.5px}

/* CTA publish band */
.cta-band{border-radius:var(--r-xl);background:linear-gradient(135deg,var(--accent),#ff8259);color:#fff;padding:50px 44px;display:flex;align-items:center;justify-content:space-between;gap:30px;flex-wrap:wrap}
.cta-band h2{color:#fff;font-size:28px;margin-bottom:8px}
.cta-band p{color:#ffe4d9;font-size:14.5px;max-width:420px}
.cta-band .btn{background:#fff;color:var(--ink);border-color:#fff}
.cta-band .btn:hover{background:#111;color:#fff;border-color:#111}

/* ===== footer ===== */
#footer{background:var(--navy);color:#a7acba;padding:56px 0 26px;margin-top:60px}
.foot-grid{display:grid;grid-template-columns:2fr repeat(4,1fr);gap:30px;margin-bottom:40px}
@media(max-width:900px){.foot-grid{grid-template-columns:repeat(2,1fr)}}
.foot-grid h5{color:#fff;font:700 12px var(--fb);letter-spacing:.04em;margin-bottom:14px}
.foot-grid a{display:block;color:#a7acba;font-size:13px;margin-bottom:9px}
.foot-grid a:hover{color:#fff}
.foot-bottom{border-top:1px solid rgba(255,255,255,.1);padding-top:22px;display:flex;justify-content:space-between;font-size:12.5px;color:#7d8296;flex-wrap:wrap;gap:10px}

/* ===== search / results layout ===== */
#searchHead{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:72px;z-index:150;padding:14px 0}
.searchhead-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.mini-search{display:flex;align-items:center;gap:0;border:1px solid var(--line-2);border-radius:999px;background:var(--surface);flex:1;min-width:260px;box-shadow:var(--shadow-sm)}
.mini-search input{flex:1;border:none;outline:none;padding:11px 16px;font:600 13.5px var(--fb);background:transparent}
.mini-search button{border:none;background:var(--navy);color:#fff;width:38px;height:38px;border-radius:999px;margin:3px;display:grid;place-items:center}
.viewtoggle{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px}
.viewtoggle button{padding:8px 14px;border-radius:999px;font:600 12.5px var(--fb);color:var(--ink-3);background:none;border:none;display:flex;align-items:center;gap:6px}
.viewtoggle button.on{background:var(--navy);color:#fff}
.sortsel{border:1px solid var(--line-2);border-radius:999px;padding:9px 14px;font:600 12.5px var(--fb);background:var(--surface)}
.filtersbtn{display:flex;align-items:center;gap:7px;border:1px solid var(--line-2);border-radius:999px;padding:9px 16px;font:600 12.5px var(--fb);background:var(--surface)}
.filtersbtn .cnt{background:var(--accent);color:#fff;font:700 10px var(--fb);padding:1px 6px;border-radius:999px}

#searchBody{display:grid;grid-template-columns:290px 1fr;gap:0;align-items:flex-start}
#searchBody.map-mode{grid-template-columns:290px 1fr 1fr}
#searchBody.map-only{grid-template-columns:290px 1fr}
@media(max-width:1080px){#searchBody,#searchBody.map-mode,#searchBody.map-only{grid-template-columns:1fr}}
#filtersCol{padding:22px 22px 22px 0;position:sticky;top:150px;max-height:calc(100vh - 160px);overflow-y:auto}
@media(max-width:1080px){#filtersCol{display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:400;background:var(--paper);max-height:none;padding:20px}
#filtersCol.open{display:block}}
.fgroup{padding:16px 0;border-bottom:1px solid var(--line)}
.fgroup:first-child{padding-top:0}
.fgroup summary{cursor:pointer;font:700 13px var(--fb);display:flex;justify-content:space-between;align-items:center;list-style:none}
.fgroup summary::-webkit-details-marker{display:none}
.fgroup summary .chev{transition:.2s}
.fgroup[open] summary .chev{transform:rotate(180deg)}
.fgroup .fbody{padding-top:12px;display:flex;flex-direction:column;gap:9px}
.range2{display:flex;gap:8px;align-items:center}
.range2 input{width:100%;border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;font:600 12.5px var(--fb)}
.chiplist{display:flex;flex-wrap:wrap;gap:7px}
.chiplist button{padding:7px 12px;border:1px solid var(--line-2);border-radius:999px;font:600 12px var(--fb);background:var(--surface);color:var(--ink-2)}
.chiplist button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.optrow{display:flex;align-items:center;justify-content:space-between;gap:8px;font:500 13px var(--fb);color:var(--ink-2)}
.optrow input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent)}
.switch{position:relative;width:38px;height:22px;background:var(--line-2);border-radius:999px;border:none;flex-shrink:0}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;background:#fff;border-radius:50%;transition:.16s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch.on{background:var(--accent)}
.switch.on::after{left:18px}

#resultsCol{padding:22px 0}
.results-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;color:var(--ink-3);font-size:13px;font-weight:600}
.results-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
#searchBody.map-mode .results-grid{grid-template-columns:1fr}
@media(max-width:1300px){.results-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){.results-grid{grid-template-columns:1fr}}
.results-list{display:flex;flex-direction:column;gap:14px}
.rowcard{display:grid;grid-template-columns:190px 1fr;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;transition:.15s}
.rowcard:hover{box-shadow:var(--shadow-md)}
.rowcard .ph{aspect-ratio:auto;height:100%}
.rowcard .pb{padding:14px 14px 14px 0}
@media(max-width:560px){.rowcard{grid-template-columns:110px 1fr}}

#mapCol{position:sticky;top:150px;height:calc(100vh - 160px);border-left:1px solid var(--line)}
.mapbox{position:relative;width:100%;height:100%;background:#e7ecef;overflow:hidden}
.mapbox svg{width:100%;height:100%}
.map-note{position:absolute;bottom:10px;left:10px;background:rgba(255,255,255,.92);padding:6px 10px;border-radius:8px;font:600 10.5px var(--fb);color:var(--ink-3);border:1px solid var(--line)}
.pin{position:absolute;transform:translate(-50%,-100%);cursor:pointer;transition:.15s}
.pin .bub{background:var(--navy);color:#fff;font:700 11.5px var(--fb);padding:6px 11px;border-radius:999px;white-space:nowrap;box-shadow:var(--shadow-md);border:2px solid #fff}
.pin .tri{width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:7px solid var(--navy);margin:0 auto}

<script>
/* ============================================================

const CITIES = [
 {id:'leon',name:'León',state:'Guanajuato',lat:21.12,lng:-101.68,rent:94,vacancy:3.8,inventory:215000,yoy:7.2},
 {id:'qro',name:'Querétaro',state:'Querétaro',lat:20.59,lng:-100.39,rent:112,vacancy:2.9,inventory:340000,yoy:9.1},

 {id:'tij',name:'Tijuana',state:'Baja California',lat:32.51,lng:-117.02,rent:158,vacancy:1.4,inventory:280000,yoy:13.8},
 {id:'gdl',name:'Guadalajara',state:'Jalisco',lat:20.67,lng:-103.35,rent:118,vacancy:3.2,inventory:295000,yoy:8.4},
 {id:'slp',name:'San Luis Potosí',state:'San Luis Potosí',lat:22.15,lng:-100.98,rent:98,vacancy:4.1,inventory:180000,yoy:6.7},

const PTYPES = ['Nave industrial','Bodega','Cross-dock','Última milla','Centro de distribución','Terreno industrial'];
const OPS = ['Manufactura','Almacenamiento','Distribución','Última milla','Logística','Cross-dock','Alimentos','Automotriz','E-commerce','Otro'];

const AVAIL_OPTS = [
  {id:'immediate',label:'Inmediata'},{id:'30',label:'30 días'},{id:'60',label:'60 días'},
  {id:'90',label:'90 días'},{id:'soon',label:'Próximamente'}
];
const PALETTES = [
  {a:'#ffb199',b:'#ff5d2e',ground:'#e8ded4',sky:'#fff3ee'},
  {a:'#9fc9ff',b:'#2b5fd9',ground:'#dfe6ef',sky:'#eef4ff'},
  {a:'#a9e0c9',b:'#1c7c54',ground:'#dde8e0',sky:'#eafaf1'},

];
function hashStr(s){let h=0;for(let i=0;i<s.length;i++){h=(h<<5)-h+s.charCodeAt(i);h|=0}return Math.abs(h)}
function mulberry32(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function rngFor(id){return mulberry32(hashStr(id))}

const PARK_NAMES = {

 qro:['Interpuerto Querétaro','Parque Industrial Bernardo Quintana','Aeropark Querétaro'],

const RAW_PROPS = [
 ['p01','leon',5200,'Nave industrial',92,10,4,'immediate',true,true],
 ['p02','qro',3100,'Bodega',108,8,3,'30',true,false],
 ['p03','mty',12500,'Centro de distribución',128,12,10,'immediate',true,true],
 ['p04','tij',2400,'Última milla',162,7,2,'immediate',false,false],
 ['p05','gdl',7600,'Nave industrial',115,10,6,'60',true,true],
 ['p06','slp',4300,'Cross-dock',96,9,8,'immediate',true,false],
 ['p07','sal',9800,'Nave industrial',86,11,7,'90',true,false],
 ['p08','cjs',15200,'Centro de distribución',138,12,14,'30',true,true],
 ['p09','rey',3600,'Bodega',94,8,3,'immediate',false,false],
 ['p10','tol',6100,'Nave industrial',119,10,5,'soon',true,true],
 ['p11','leon',980,'Bodega',110,7,1,'immediate',false,false],
 ['p12','qro',21000,'Terreno industrial',48,0,0,'90',true,false],
 ['p13','mty',2650,'Última milla',148,6,2,'immediate',true,false],
 ['p14','gdl',1450,'Bodega',122,7,2,'30',false,false],
 ['p15','tij',5400,'Cross-dock',155,9,9,'60',true,true],
 ['p16','sal',3900,'Nave industrial',88,8,4,'immediate',true,false],
];

function buildProperty(row,idx){
  const [id,cityId,area,ptype,pricePerM2,height,docks,availId,verified,featured]=row;
  const city=CITY_MAP[cityId];
  const rng=rngFor(id);
  const parks=PARK_NAMES[cityId];
  const park=parks[idx%parks.length];
  const officePct=ptype==='Terreno industrial'?0:(0.03+rng()*0.07);
  const areaOffice=Math.round(area*officePct);
  const areaWarehouse=area-areaOffice;
  const monthly=Math.round(area*pricePerM2);
  const opsCount=1+Math.floor(rng()*3);
  const ops=[...OPS].sort(()=>rng()-.5).slice(0,opsCount);
  const security=SECURITY_OPTS.filter(()=>rng()>0.45);
  const fire=FIRE_OPTS.filter(()=>rng()>0.4);
  const certs=CERT_OPTS.filter(()=>rng()>0.72);
  const verifiedDays=verified?1+Math.floor(rng()*12):null;
  const power=Math.round((150+rng()*950)/10)*10;

function fmtMoney(n){return '$'+Math.round(n).toLocaleString('es-MX')}
function fmtNum(n){return Math.round(n).toLocaleString('es-MX')}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function qs(obj){return Object.entries(obj).filter(([k,v])=>v!==undefined&&v!==null&&v!=='').map(([k,v])=>encodeURIComponent(k)+'='+encodeURIComponent(v)).join('&')}
function parseHash(){
  const h=location.hash.slice(1)||'/';
  const [path,query='']=h.split('?');
  const params={};
  new URLSearchParams(query).forEach((v,k)=>{
    if(params[k]!==undefined){params[k]=[].concat(params[k],v)} else params[k]=v;
  });
  return {path,params};
}

const VIEW_ROOT=()=>document.getElementById('view');
function dispatchView(path,params,freshSearch){
  if(path==='/'||path==='')return renderHome();
  if(path==='/buscar')return freshSearch?renderSearch(params):(SS?searchShellHTML():renderSearch(params));
  if(path.startsWith('/propiedad/'))return renderPropertyDetail(path.split('/')[2]);
  if(path==='/comparar')return renderCompare();
  if(path==='/match')return renderMatch();
  if(path==='/publicar')return renderPublish();
  if(path==='/panel')return renderDashboard();
  if(path==='/inteligencia')return renderIntelligence();
  if(path==='/admin')return renderAdmin();
  if(path==='/cuenta')return renderAccount(params);
  return `<div class="wrap section"><div class="empty-state"><h3>Página no encontrada</h3><p>Regresa al <a href="#/" style="color:var(--accent-dark);font-weight:700">inicio</a>.</p></div></div>`;
}
function finishRender(){
  renderNav();
  renderFooter();
  if(window.__postRender){window.__postRender();window.__postRender=null;}
}
function render(){
  const {path,params}=parseHash();
  document.body.classList.remove('has-mobcta');
  document.getElementById('mobileCta').className='mobile-cta';
  document.getElementById('mobileCta').innerHTML='';
  VIEW_ROOT().innerHTML=dispatchView(path,params,true);
  finishRender();
  window.scrollTo({top:0,behavior:'instant'});
  document.getElementById('filtersCol')?.classList.remove('open');
}
function softRerender(){
  const {path,params}=parseHash();
  document.body.classList.remove('has-mobcta');
  document.getElementById('mobileCta').className='mobile-cta';
  document.getElementById('mobileCta').innerHTML='';
  const openDrawer=document.getElementById('filtersCol')?.classList.contains('open');
  VIEW_ROOT().innerHTML=dispatchView(path,params,false);
  finishRender();
  if(openDrawer)document.getElementById('filtersCol')?.classList.add('open');
}
window.addEventListener('hashchange',render);

let SS=null; // current search state (in-memory, not URL-synced after init)
const HEIGHT_OPTS=[6,8,10,12,99];
function paramsToSS(params){
  return {
    q: params.q||'',
    tipo: params.tipo||'',
    areaMin: params.areaMin?Number(params.areaMin):null,
    areaMax: params.areaMax?Number(params.areaMax):null,
    priceMax: params.priceMax?Number(params.priceMax):null,
    ptypes: new Set(params.ptype?[].concat(params.ptype):[]),
    heightMin: params.heightMin?Number(params.heightMin):null,
    docksMin: params.docksMin?Number(params.docksMin):null,
    ramp:false, yard:false, trailer:false,
    powerMin:null, floorLoadMin:null,
    security:new Set(), fire:new Set(), certs:new Set(),
    availability:new Set(params.availId?[params.availId]:[]),
    sort:'relevance', mode:'list', activePin:null,
  };
}
function activeFilterCount(SS){
  let n=0;
  if(SS.q)n++; if(SS.tipo)n++; if(SS.areaMin)n++; if(SS.areaMax)n++; if(SS.priceMax)n++;
  n+=SS.ptypes.size; if(SS.heightMin)n++; if(SS.docksMin)n++;
  if(SS.ramp)n++; if(SS.yard)n++; if(SS.trailer)n++; if(SS.powerMin)n++; if(SS.floorLoadMin)n++;
  n+=SS.security.size+SS.fire.size+SS.certs.size+SS.availability.size;
  return n;
}
function matchesFilters(p,SS){
  if(SS.q){
    const hay=(p.city+' '+p.state+' '+p.park).toLowerCase();
    if(!hay.includes(SS.q.toLowerCase()))return false;
  }
  if(SS.tipo && !(p.ops.includes(SS.tipo)||p.ptype===SS.tipo))return false;
  if(SS.areaMin && p.area<SS.areaMin)return false;
  if(SS.areaMax && p.area>SS.areaMax)return false;
  if(SS.priceMax && p.pricePerM2>SS.priceMax)return false;
  if(SS.ptypes.size && !SS.ptypes.has(p.ptype))return false;
  if(SS.heightMin){ if(SS.heightMin>=99){ if(p.height<=12)return false } else if(p.height<SS.heightMin)return false }
  if(SS.docksMin && p.docks<SS.docksMin)return false;
  if(SS.ramp && !p.ramp)return false;
  if(SS.yard && !p.yard)return false;
  if(SS.trailer && !p.trailer)return false;
  if(SS.powerMin && p.power<SS.powerMin)return false;
  if(SS.floorLoadMin && p.floorLoad<SS.floorLoadMin)return false;
  if(SS.security.size && ![...SS.security].every(s=>p.security.includes(s)))return false;
  if(SS.fire.size && ![...SS.fire].every(s=>p.fire.includes(s)))return false;
  if(SS.certs.size && ![...SS.certs].some(s=>p.certs.includes(s)))return false;
  if(SS.availability.size && !SS.availability.has(p.availId))return false;
  return true;
}
function sortResults(list,sort){
  const l=[...list];
  if(sort==='price_asc')l.sort((a,b)=>a.pricePerM2-b.pricePerM2);
  else if(sort==='price_desc')l.sort((a,b)=>b.pricePerM2-a.pricePerM2);
  else if(sort==='area_desc')l.sort((a,b)=>b.area-a.area);
  else if(sort==='area_asc')l.sort((a,b)=>a.area-b.area);
  else if(sort==='height_desc')l.sort((a,b)=>b.height-a.height);
  else l.sort((a,b)=>(b.featured-a.featured)||(a.pricePerM2-b.pricePerM2));
  return l;
}
function chipList(opts,activeCheck,onClick){
  return `<div class="chiplist">${opts.map(o=>{
    const label=typeof o==='object'?o.label:o;
    const val=typeof o==='object'?o.value:o;
    return `<button type="button" class="${activeCheck(val)?'on':''}" onclick='${onClick}(${JSON.stringify(val)})'>${esc(label)}</button>`;
  }).join('')}</div>`;
}

function projectPoint(p,bounds){
  const {minLat,maxLat,minLng,maxLng}=bounds;
  const padY=0.12,padX=0.08;
  const x=maxLng>minLng?(p.lng-minLng)/(maxLng-minLng):0.5;
  const y=maxLat>minLat?(p.lat-minLat)/(maxLat-minLat):0.5;
  const left=(padX+x*(1-2*padX))*100;
  const top=((1-padY)-y*(1-2*padY))*100;
  return {left,top};
}
function computeBounds(list){
  const lats=list.map(p=>p.lat),lngs=list.map(p=>p.lng);
  return {minLat:Math.min(...lats),maxLat:Math.max(...lats),minLng:Math.min(...lngs),maxLng:Math.max(...lngs)};
}
function mapHTML(list,activeId){
  if(!list.length)return `<div class="mapbox"><div class="empty-state" style="padding-top:40%">Sin resultados para mostrar en el mapa.</div></div>`;
  const bounds=computeBounds(list);
  const pins=list.map(p=>{
    const {left,top}=projectPoint(p,bounds);
    return `<div class="pin ${activeId===p.id?'active':''}" style="left:${left}%;top:${top}%" onclick="App.selectPin('${p.id}')" onmouseenter="App.hoverPin('${p.id}')">
      <div class="bub">${fmtMoney(p.pricePerM2)}/m²</div><div class="tri"></div>
    </div>`;
  }).join('');
  return `<div class="mapbox" id="mapboxEl">
    ${abstractMapBg()}
    ${pins}
    <div class="map-note">${icon('map')} Vista ilustrativa · lista para conectar Mapbox / Google Maps</div>

}

   ============================================================ */
let WZ_STEP=0;
let WZ={city:'',areaMin:'',areaMax:'',op:'',trailers:'',height:'',power:'',docks:'',startWhen:'',budget:''};
const WZ_STEPS=[
  {key:'city',kicker:'Paso 1 de 9',q:'¿Dónde necesitas la bodega?'},
  {key:'area',kicker:'Paso 2 de 9',q:'¿Cuántos metros cuadrados necesitas?'},
  {key:'op',kicker:'Paso 3 de 9',q:'¿Para qué la utilizarás?'},
  {key:'trailers',kicker:'Paso 4 de 9',q:'¿Cuántos tráileres recibes diariamente?'},
  {key:'height',kicker:'Paso 5 de 9',q:'¿Qué altura libre necesitas?'},
  {key:'power',kicker:'Paso 6 de 9',q:'¿Cuánta energía eléctrica necesitas?'},
  {key:'docks',kicker:'Paso 7 de 9',q:'¿Cuántos andenes necesitas?'},
  {key:'startWhen',kicker:'Paso 8 de 9',q:'¿Cuándo necesitas comenzar operaciones?'},
  {key:'budget',kicker:'Paso 9 de 9',q:'¿Cuál es tu presupuesto por m²?'},
];
function computeMatch(p,wz){
  const reasons=[];let achieved=0,total=0;
  const cityWanted=CITIES.find(c=>c.name===wz.city);
  if(cityWanted){
    total+=30;
    if(p.cityId===cityWanted.id){achieved+=30;reasons.push({ok:true,text:`Ubicada en ${p.city}, tu ciudad objetivo`})}
    else reasons.push({ok:false,text:`Ubicada en ${p.city}, fuera de ${wz.city}`});
  }
  if(wz.areaMin||wz.areaMax){
    total+=20;
    const aMin=Number(wz.areaMin)||0,aMax=Number(wz.areaMax)||Infinity;
    if(p.area>=aMin && p.area<=aMax){achieved+=20;reasons.push({ok:true,text:`Superficie de ${fmtNum(p.area)} m² dentro de tu rango`})}
    else{
      const mid=(aMin+(aMax===Infinity?aMin*1.4:aMax))/2;
      const diff=Math.abs(p.area-mid)/(mid||1);
      if(diff<0.35){achieved+=10;reasons.push({ok:true,text:`Superficie de ${fmtNum(p.area)} m², cercana a lo que buscas`})}
      else reasons.push({ok:false,text:`Superficie de ${fmtNum(p.area)} m², fuera de tu rango`});
    }
  }
  if(wz.op){
    total+=15;
    if(p.ops.includes(wz.op)){achieved+=15;reasons.push({ok:true,text:`Apta para operaciones de ${wz.op.toLowerCase()}`})}
    else reasons.push({ok:false,text:`No está listada para ${wz.op.toLowerCase()}`});
  }
  const hWanted=Number(wz.height)||0;
  if(hWanted){
    total+=10;
    if(p.height>=hWanted){achieved+=10;reasons.push({ok:true,text:`Altura libre de ${p.height} m cumple tu requerimiento`})}
    else reasons.push({ok:false,text:`Altura libre de ${p.height} m, menor a los ${hWanted} m que necesitas`});
  }
  const dWanted=Number(wz.docks)||Math.ceil((Number(wz.trailers)||0)/3);
  if(dWanted){
    total+=10;
    if(p.docks>=dWanted){achieved+=10;reasons.push({ok:true,text:`${p.docks} andenes, suficientes para tu operación`})}
    else reasons.push({ok:false,text:`Solo ${p.docks} andenes, menos de los ${dWanted} recomendados`});
  }
  const pWanted=Number(wz.power)||0;
  if(pWanted){
    total+=10;
    if(p.power>=pWanted){achieved+=10;reasons.push({ok:true,text:`${p.power} kVA disponibles cubren tu demanda eléctrica`})}
    else reasons.push({ok:false,text:`${p.power} kVA disponibles, menos de los ${pWanted} kVA requeridos`});
  }
  const bWanted=Number(wz.budget)||0;
  if(bWanted){
    total+=15;
    if(p.pricePerM2<=bWanted){achieved+=15;reasons.push({ok:true,text:`${fmtMoney(p.pricePerM2)} MXN/m², dentro de tu presupuesto`})}
    else{
      const over=(p.pricePerM2-bWanted)/bWanted;
      if(over<0.15){achieved+=6;reasons.push({ok:false,text:`${fmtMoney(p.pricePerM2)} MXN/m², ligeramente sobre tu presupuesto`})}
      else reasons.push({ok:false,text:`${fmtMoney(p.pricePerM2)} MXN/m², sobre tu presupuesto de ${fmtMoney(bWanted)}`});
    }
  }
  let score=total?Math.round(achieved/total*100):50;
  if(cityWanted && p.cityId!==cityWanted.id) score=Math.round(score*0.55);
  reasons.sort((a,b)=>(b.ok-a.ok));
  return {score:Math.min(100,score),reasons};
}
function scoreColor(s){return s>=90?'#1c7c54':s>=75?'#b45309':'#2b5fd9'}
function wizProgressHTML(){
  const n=WZ_STEPS.length;

function wizStepBody(){
  const step=WZ_STEPS[WZ_STEP];
  let body='';

    body=`<div class="wiz-opts">${CITIES.map(c=>`<button type="button" class="wiz-opt ${WZ.city===c.name?'on':''}" onclick="App.wizSet('city','${c.name.replace(/'/g,"\\'")}')">${icon('pin')} ${c.name}</button>`).join('')}</div>`;

    body=`<div class="wiz-opts">${[6,8,10,12,15].map(h=>`<button type="button" class="wiz-opt ${Number(WZ.height)===h?'on':''}" onclick="App.wizSet('height','${h}')">${h} m</button>`).join('')}</div>`;

    body=`<input class="wiz-input" type="number" placeholder="Ej. 4" value="${WZ.docks}" onchange="App.wizSet('docks',this.value)">`;

  } else if(step.key==='budget'){
    body=`<input class="wiz-input" type="number" placeholder="MXN por m², ej. 110" value="${WZ.budget}" onchange="App.wizSet('budget',this.value)">`;
  }
  return `<div class="wiz-step">
    <div class="kicker">${step.kicker}</div>
    <h2>${step.q}</h2>
    ${body}
    <div class="wiz-nav">
      <button class="btn" onclick="App.wizBack()" ${WZ_STEP===0?'disabled':''}>${icon('arrowL')} Atrás</button>
      <button class="btn pri" onclick="App.wizNext()">${WZ_STEP===WZ_STEPS.length-1?'Ver resultados':'Continuar'} ${icon('arrowR')}</button>
    </div>
  </div>`;
}
function wizResultsHTML(){
  const scored=PROPERTIES.map(p=>({p,...computeMatch(p,WZ)})).sort((a,b)=>b.score-a.score);
  const compatible=scored.filter(s=>s.score>=55);

  return `<div style="max-width:760px;margin:0 auto">

    <div style="display:flex;gap:10px;justify-content:center;margin-top:30px">

const DASH_SAMPLE_IDS=['p01','p05','p08'];

function sparkSVG(seed){
  const rng=rngFor(seed+'_spark');
  const pts=Array.from({length:14},()=>20+rng()*60);
  const max=Math.max(...pts),min=Math.min(...pts);
  const path=pts.map((v,i)=>`${(i/13*100).toFixed(1)},${(36-((v-min)/(max-min||1))*32).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 100 36" class="chart" style="height:36px"><polyline points="${path}" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

function requirementMatches(req){
  return PROPERTIES.filter(p=>{
    if(req.city && p.city!==req.city)return false;
    if(req.areaMin && p.area<req.areaMin)return false;
    if(req.areaMax && p.area>req.areaMax)return false;
    if(req.budget && p.pricePerM2>req.budget*1.05)return false;
    if(req.ops && !p.ops.includes(req.ops))return false;
    return true;
  });
}

        <div class="fld"><label>Tipo de operación</label><select id="rqOps">${OPS.map(o=>`<option>${o}</option>`).join('')}</select></div>

        <div class="fld"><label>Superficie máxima (m²)</label><input id="rqAreaMax" type="number" required></div>
        <div class="fld"><label>Presupuesto (MXN/m²)</label><input id="rqBudget" type="number" required></div>
        <div class="fld"><label>Fecha de inicio</label><input id="rqStart" placeholder="Ej. Octubre 2026" required></div>
      </div>
      <button class="btn pri" style="margin-top:16px" type="submit">${icon('plus')} Crear requerimiento</button>
    </form>
  </div>`;
}

/* ============================================================
   ADMIN PANEL (light)
   ============================================================ */
const MOCK_USERS=[
  {name:'Andrea Martínez',email:'andrea@leonlogistics.mx',role:'Propietario',since:'Ene 2026'},
  {name:'Carlos Reyes',email:'carlos@vestaindustrial.mx',role:'Broker',since:'Feb 2026'},
  {name:'Fernanda López',email:'fernanda@fema-mfg.com',role:'Empresa',since:'Mar 2026'},
  {name:'Diego Salas',email:'diego@finsa.mx',role:'Broker',since:'Mar 2026'},
  {name:'Paola Vidal',email:'paola@grupovesta.com',role:'Propietario',since:'Abr 2026'},
];
const MOCK_LEADS=[
  {company:'Autoparts MX',property:'Nave industrial — León Logistics Park',type:'Solicitud de visita',date:'2 sep 2026'},
  {company:'Amazon 3PL Partner',property:'Centro de distribución — Vynmsa Zuazua',type:'Información',date:'1 sep 2026'},
  {company:'ColdChain Foods',property:'Cross-dock — Interpuerto SLP',type:'Asesor',date:'30 ago 2026'},
  {company:'ElectroImport SA',property:'Bodega — Interpuerto Querétaro',type:'Solicitud de visita',date:'28 ago 2026'},
];
function renderAdmin(){
  const tab=(parseHash().params.tab)||'overview';
  const goto=t=>`location.hash='#/admin?tab=${t}'`;
  let body='';
  if(tab==='usuarios'){
    body=`<table class="dtable"><tr><th>Nombre</th><th>Correo</th><th>Rol</th><th>Alta</th></tr>
    ${MOCK_USERS.map(u=>`<tr><td style="font-weight:700">${u.name}</td><td>${u.email}</td><td>${u.role}</td><td>${u.since}</td></tr>`).join('')}</table>`;
  } else if(tab==='propiedades'){
    body=`<table class="dtable"><tr><th>Propiedad</th><th>Ciudad</th><th>Precio/m²</th><th>Estado</th><th>Verificada</th></tr>
    ${PROPERTIES.map(p=>`<tr><td style="font-weight:700">${p.ptype} — ${p.park}</td><td>${p.city}</td><td>${fmtMoney(p.pricePerM2)}</td><td><span class="status-chip active">Activa</span></td><td>${p.verified?icon('check'):'—'}</td></tr>`).join('')}</table>`;
  } else if(tab==='leads'){
    body=`<table class="dtable"><tr><th>Empresa</th><th>Propiedad</th><th>Tipo</th><th>Fecha</th></tr>
    ${MOCK_LEADS.map(l=>`<tr><td style="font-weight:700">${l.company}</td><td>${l.property}</td><td>${l.type}</td><td>${l.date}</td></tr>`).join('')}</table>`;
  } else if(tab==='ciudades'){
    body=`<table class="dtable"><tr><th>Ciudad</th><th>Estado</th><th>Renta prom.</th><th>Vacancia</th><th>Inventario</th></tr>
    ${CITIES.map(c=>`<tr><td style="font-weight:700">${c.name}</td><td>${c.state}</td><td>${fmtMoney(c.rent)}/m²</td><td>${c.vacancy}%</td><td>${fmtNum(c.inventory)} m²</td></tr>`).join('')}</table>`;
  } else {
    body=`<div class="kpi-grid">
      <div class="kpi-card"><div class="kl">Usuarios totales</div><div class="kv">${MOCK_USERS.length*38}</div><div class="kd up">${icon('sparkline')} +9.1%</div></div>
      <div class="kpi-card"><div class="kl">Propiedades activas</div><div class="kv">${PROPERTIES.length+state.myListings.length}</div><div class="kd">En ${CITIES.length} ciudades</div></div>
      <div class="kpi-card"><div class="kl">Leads este mes</div><div class="kv">${MOCK_LEADS.length*57}</div><div class="kd up">${icon('sparkline')} +14.2%</div></div>
      <div class="kpi-card"><div class="kl">m² publicados</div><div class="kv">${fmtNum(PROPERTIES.reduce((s,p)=>s+p.area,0)/1000)}k</div><div class="kd">Inventario en plataforma</div></div>
    </div>`;
  }
  return `<div class="wrap section">
    <div class="section-head"><div><div class="eyebrow">Administración</div><h2>Panel administrativo</h2><p>Vista general de usuarios, propiedades, leads y ciudades en la plataforma.</p></div></div>
    <div class="tabs">
      <button class="${tab==='overview'?'on':''}" onclick="${goto('overview')}">General</button>
      <button class="${tab==='usuarios'?'on':''}" onclick="${goto('usuarios')}">Usuarios</button>
      <button class="${tab==='propiedades'?'on':''}" onclick="${goto('propiedades')}">Propiedades</button>
      <button class="${tab==='leads'?'on':''}" onclick="${goto('leads')}">Leads</button>
      <button class="${tab==='ciudades'?'on':''}" onclick="${goto('ciudades')}">Ciudades</button>
    </div>
    <div class="tblw">${body}</div>
  </div>`;
}

/* ============================================================
   PROPERTY DETAIL VIEW
   ============================================================ */
function renderPropertyDetail(id){
  const p=getProp(id);
  if(!p)return `<div class="wrap section"><div class="empty-state"><h3>Propiedad no encontrada</h3><a href="#/buscar" class="btn pri" style="margin-top:12px">Ver propiedades</a></div></div>`;
  const saved=state.saved.has(p.id);
  const compared=state.compare.has(p.id);
  const similar=PROPERTIES.filter(x=>x.cityId===p.cityId && x.id!==p.id).slice(0,3);
  const waText=encodeURIComponent(`Hola, me interesa la propiedad "${p.title}" en ${p.city} (${fmtMoney(p.pricePerM2)} MXN/m²). ¿Podemos agendar una visita?`);
  window.__postRender=()=>{
    document.getElementById('mobileCta').className='mobile-cta show';
    document.getElementById('mobileCta').innerHTML=`
      <div class="price">${fmtMoney(p.pricePerM2)}/m²<small>${fmtMoney(p.monthly)}/mes</small></div>
      <a class="btn icon-only" href="https://wa.me/5215500000000?text=${waText}" target="_blank" rel="noopener" style="background:#25D366;border-color:#25D366;color:#fff">${icon('wa')}</a>
      <button class="btn pri sm" onclick="App.requestVisit('${p.id}')">Solicitar visita</button>
    `;
    document.body.classList.add('has-mobcta');
  };
  return `
  <div class="wrap" style="padding-top:20px">
    <div style="font-size:12.5px;color:var(--ink-3);margin-bottom:14px">
      <a href="#/buscar" style="font-weight:600">Buscar</a> / <a href="#/buscar?ciudad=${encodeURIComponent(p.city)}" style="font-weight:600">${esc(p.city)}</a> / ${esc(p.ptype)}
    </div>
    <div class="pd-gallery">
      <div>${illustration(p.id+'_a',p.paletteIdx)}</div>
      <div>${illustration(p.id+'_b',(p.paletteIdx+1)%PALETTES.length)}</div>
      <div>${illustration(p.id+'_c',(p.paletteIdx+2)%PALETTES.length)}</div>
      <div>${illustration(p.id+'_d',(p.paletteIdx+3)%PALETTES.length)}</div>
      <div>${illustration(p.id+'_e',(p.paletteIdx+4)%PALETTES.length)}</div>
    </div>
    <div class="pd-top">
      <div>
        <div style="display:flex;gap:8px;margin-bottom:8px">
          ${p.featured?'<span class="badge featured">★ Destacada</span>':''}
          ${availBadgeHTML(p)}
        </div>
        <h1>${esc(p.title)}</h1>
        <div class="pd-loc">${icon('pin')} ${esc(p.park)}, ${esc(p.city)}, ${esc(p.state)}</div>
      </div>
      <div class="pd-actions">
        <button class="btn icon-only ${saved?'pri':''}" onclick="App.toggleSave('${p.id}',event)">${icon('heart')}</button>
        <button class="btn ${compared?'dark':''}" onclick="App.toggleCompare('${p.id}',event)">${icon('scale')} ${compared?'En comparador':'Comparar'}</button>
      </div>
    </div>

    <div class="pd-layout">
      <div>
        ${p.verified?`<div class="verified-box" style="margin-bottom:24px"><div class="ic-wrap">${icon('check')}</div><div><b>Propiedad verificada</b><span>Disponibilidad verificada hace ${p.verifiedDays} día${p.verifiedDays===1?'':'s'}. Propietario, ubicación y datos técnicos confirmados por Nave.</span></div></div>`:''}

        <div class="pd-section">
          <h3>Resumen</h3>
          <p style="color:var(--ink-2);line-height:1.7">${esc(p.ptype)} de ${fmtNum(p.area)} m² en ${esc(p.park)}, ${esc(p.city)}. Ideal para operaciones de ${esc(p.ops.join(', ').toLowerCase())}. Cuenta con ${p.docks} andenes, ${p.height} m de altura libre y ${p.power} kVA de capacidad eléctrica disponible.</p>
        </div>

        <div class="pd-section">
          <h3>Información técnica</h3>
          <div class="spec-grid">
            <div class="spec"><div class="ic-wrap">${icon('ruler')}</div><div><b>${fmtNum(p.area)} m²</b><span>Área total</span></div></div>
            <div class="spec"><div class="ic-wrap">${icon('building')}</div><div><b>${fmtNum(p.areaWarehouse)} m²</b><span>Área de almacén</span></div></div>
            <div class="spec"><div class="ic-wrap">${icon('building')}</div><div><b>${fmtNum(p.areaOffice)} m²</b><span>Área de oficinas</span></div></div>
            <div class="spec"><div class="ic-wrap">${icon('height')}</div><div><b>${p.height} m</b><span>Altura libre</span></div></div>
            <div class="spec"><div class="ic-wrap">${icon('dock')}</div><div><b>${p.docks}</b><span>Andenes</span></div></div>
            <div class="spec"><div class="ic-wrap">${icon('truck')}</div><div><b>${p.ramp?'Sí':'No'}</b><span>Rampa</span></div></div>
            <div class="spec"><div class="ic-wrap">${icon('layers')}</div><div><b>${p.yard?'Sí':'No'}</b><span>Patio de maniobras</span></div></div>
            <div class="spec"><div class="ic-wrap">${icon('truck')}</div><div><b>${p.trailer?'Sí':'No'}</b><span>Acceso para tráiler</span></div></div>
            <div class="spec"><div class="ic-wrap">${icon('users')}</div><div><b>${p.parking}</b><span>Cajones de estacionamiento</span></div></div>
            <div class="spec"><div class="ic-wrap">${icon('bolt')}</div><div><b>${p.power} kVA</b><span>Capacidad eléctrica</span></div></div>
            <div class="spec"><div class="ic-wrap">${icon('ruler')}</div><div><b>${p.floorLoad} ton/m²</b><span>Capacidad del piso</span></div></div>
            <div class="spec"><div class="ic-wrap">${icon('shield')}</div><div><b>${esc(p.landUse)}</b><span>Uso de suelo</span></div></div>
            <div class="spec"><div class="ic-wrap">${icon('bolt')}</div><div><b>${esc(p.lighting)}</b><span>Iluminación</span></div></div>
            <div class="spec"><div class="ic-wrap">${icon('layers')}</div><div><b>${esc(p.ventilation)}</b><span>Ventilación</span></div></div>
          </div>
        </div>

        <div class="pd-section">
          <h3>Seguridad y protección contra incendios</h3>
          <div class="tagrow">
            ${p.security.map(s=>`<span class="t">${icon('shield')} ${esc(s)}</span>`).join('')||'<span class="t">Sin información adicional</span>'}
            ${p.fire.map(s=>`<span class="t">${icon('bolt')} ${esc(s)}</span>`).join('')}
            ${p.certs.map(s=>`<span class="t">${icon('badge')} ${esc(s)}</span>`).join('')}
          </div>
        </div>

        <div class="pd-section">
          <h3>Tipo de operación recomendado</h3>
          <div class="tagrow">${p.ops.map(o=>`<span class="t">${esc(o)}</span>`).join('')}</div>
        </div>

        <div class="pd-section">
          <h3>Conectividad y ubicación estratégica</h3>
          <div class="dist-list" style="margin-bottom:16px">
            <div class="dist-item"><div class="l">${icon('road')} Carretera principal</div><div class="v">${p.distHighway} km</div></div>
            <div class="dist-item"><div class="l">${icon('plane')} Aeropuerto</div><div class="v">${p.distAirport} km</div></div>
            <div class="dist-item"><div class="l">${icon('building')} Zona industrial / parque</div><div class="v">${p.distZone} km</div></div>
            ${p.distRail?`<div class="dist-item"><div class="l">${icon('train')} Ferrocarril</div><div class="v">${p.distRail} km</div></div>`:''}
          </div>
          <div class="miniMap">${mapHTML([p,...similar],p.id)}</div>
        </div>

        ${similar.length?`<div class="pd-section">
          <h3>Propiedades similares en ${esc(p.city)}</h3>
          <div class="grid-cards">${similar.map(s=>propertyCard(s)).join('')}</div>
        </div>`:''}
      </div>

      <div>
        <div class="stickycta vis-desktop-cta">
          <div class="price">${fmtMoney(p.pricePerM2)} <small>MXN/m²</small></div>
          <div class="month">${fmtMoney(p.monthly)} MXN / mes</div>
          <button class="btn pri block" onclick="App.requestVisit('${p.id}')">${icon('cal')} Solicitar visita</button>
          <button class="btn block" onclick="App.requestInfo('${p.id}','advisor')">${icon('users')} Hablar con un asesor</button>
          <button class="btn block" onclick="App.requestInfo('${p.id}','info')">Solicitar información</button>
          <button class="btn block ${compared?'dark':''}" onclick="App.toggleCompare('${p.id}',event)">${icon('scale')} ${compared?'Quitar de comparar':'Comparar'}</button>
          <button class="btn block ${saved?'pri':''}" onclick="App.toggleSave('${p.id}',event)">${icon('heart')} ${saved?'Guardada':'Guardar'}</button>
          <div class="avail-note">${icon('cal')} <span>${p.availId==='immediate'?'Disponible ahora':'Disponible desde '+esc(p.availDate)}</span></div>
          <div class="broker-row">
            <div class="av">${p.broker.split(' ').map(s=>s[0]).join('')}</div>
            <div><b>${esc(p.broker)}</b><span>${esc(p.brokerCo)}</span></div>
          </div>
        </div>
      </div>
    </div>
  </div>`;
}
</script>
</body>
