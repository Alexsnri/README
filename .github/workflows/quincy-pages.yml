# Quincy: publica la carpeta quincy/ en GitHub Pages desde la rama gh-pages y avisa a los buscadores.
# Sitio: https://alexsnri.github.io/README/quincy/
# Mudanza a un sitio propio (por ejemplo https://quincy-mx.github.io/ o un dominio): se activa sola cuando existen
# la variable QUINCY_SITIO_NUEVO (URL con / final), la variable QUINCY_REPO_NUEVO (dueño/repositorio) y el secreto
# QUINCY_PUBLICAR_TOKEN (token con permiso de escritura en ese repositorio). Entonces el sitio completo se publica allá
# con sus URLs cambiadas y, solo cuando ya responde en línea, aquí quedan redirecciones página por página (conservan ?ref= y #).
name: Quincy · publicar

on:
  push:
    branches: [main]
    paths: ["quincy/**", ".github/workflows/quincy-pages.yml"]
  workflow_run:
    workflows: ["Quincy · tasas"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quincy-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Se aceptan como variables o como secretos (por si se guardaron en la pestaña equivocada).
      NUEVO_RAW: ${{ vars.QUINCY_SITIO_NUEVO || secrets.QUINCY_SITIO_NUEVO }}
      REPO_RAW: ${{ vars.QUINCY_REPO_NUEVO || secrets.QUINCY_REPO_NUEVO }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Armar el sitio (solo quincy/)
        run: |
          mkdir -p _site
          cp -r quincy _site/quincy
          rm -rf _site/quincy/scripts _site/quincy/agentes
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=quincy/"><link rel="canonical" href="quincy/"><title>Quincy</title><a href="quincy/">Quincy</a>\n' > _site/index.html
          touch _site/.nojekyll
          cp quincy/google*.html _site/ 2>/dev/null || true

      - name: Armar el sitio nuevo
        id: nuevo
        env:
          HAS_TOKEN: ${{ secrets.QUINCY_PUBLICAR_TOKEN != '' }}
        run: |
          NUEVO=$(echo "$NUEVO_RAW" | tr -d '[:space:]'); REPO=$(echo "$REPO_RAW" | tr -d '[:space:]')
          if [ -z "$NUEVO" ] && [ -z "$REPO" ] && [ "$HAS_TOKEN" != "true" ]; then echo "Sin mudanza configurada."; exit 0; fi
          [ -n "$NUEVO" ] || { echo "::warning::Falta QUINCY_SITIO_NUEVO (variable de Actions)."; exit 0; }
          [ -n "$REPO" ] || { echo "::warning::Falta QUINCY_REPO_NUEVO (variable de Actions)."; exit 0; }
          [ "$HAS_TOKEN" = "true" ] || { echo "::warning::Falta el secreto QUINCY_PUBLICAR_TOKEN."; exit 0; }
          case "$NUEVO" in */) ;; *) NUEVO="$NUEVO/";; esac
          python3 quincy/scripts/agentes/mudanza.py armar _site "$NUEVO" _nuevo
          echo "listo=1" >> "$GITHUB_OUTPUT"
          { echo "NUEVO=$NUEVO"; echo "REPO=$REPO"; } >> "$GITHUB_ENV"

      - name: Publicar el sitio nuevo
        id: push_nuevo
        if: ${{ steps.nuevo.outputs.listo == '1' }}
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.QUINCY_PUBLICAR_TOKEN }}
        run: |
          cd _nuevo
          git init -q -b main
          git config user.name "quincy-bot"
          git config user.email "quincy-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Publicar Quincy (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${TOKEN}@github.com/${REPO}.git" main

      - name: Redirigir el sitio viejo (solo si el nuevo ya está en línea)
        if: ${{ steps.nuevo.outputs.listo == '1' && steps.push_nuevo.outcome == 'success' }}
        run: |
          KEY=a47e56b41e4abf5e6d43f62e3de33615
          for i in $(seq 1 20); do
            if curl -fsS --max-time 10 "${NUEVO}${KEY}.txt?v=${GITHUB_SHA::7}" 2>/dev/null | grep -q "$KEY"; then
              python3 quincy/scripts/agentes/mudanza.py redirigir _site "$NUEVO"
              exit 0
            fi
            sleep 15
          done
          echo "::warning::El sitio nuevo ($NUEVO) todavía no responde. Revisa Settings → Pages del repositorio nuevo. El sitio viejo se queda igual."

      - name: Publicar en la rama gh-pages
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "quincy-bot"
          git config user.email "quincy-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Publicar Quincy (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

      - name: Avisar a los buscadores (IndexNow)
        continue-on-error: true
        run: |
          sleep 60
          SITE="$NUEVO"
          if [ "${{ steps.nuevo.outputs.listo }}" = "1" ]; then
            HOST=$(python3 -c "import sys;from urllib.parse import urlparse;print(urlparse(sys.argv[1]).hostname)" "$SITE")
            URLS=$(grep -o '<loc>[^<]*</loc>' _nuevo/sitemap.xml | sed 's#</\?loc>##g' | python3 -c "import sys,json;print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))")
            curl -sS -o /dev/null -w "IndexNow (nuevo): %{http_code}\n" -X POST https://api.indexnow.org/indexnow \
              -H "Content-Type: application/json; charset=utf-8" \
              -d "{\"host\":\"$HOST\",\"key\":\"a47e56b41e4abf5e6d43f62e3de33615\",\"keyLocation\":\"${SITE}a47e56b41e4abf5e6d43f62e3de33615.txt\",\"urlList\":$URLS}"
            exit 0
          fi
          URLS=$(grep -o '<loc>[^<]*</loc>' quincy/sitemap.xml | sed 's#</\?loc>##g' | python3 -c "import sys,json;print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))")
          curl -sS -o /dev/null -w "IndexNow: %{http_code}\n" -X POST https://api.indexnow.org/indexnow \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"host\":\"alexsnri.github.io\",\"key\":\"a47e56b41e4abf5e6d43f62e3de33615\",\"keyLocation\":\"https://alexsnri.github.io/README/quincy/a47e56b41e4abf5e6d43f62e3de33615.txt\",\"urlList\":$URLS}"
