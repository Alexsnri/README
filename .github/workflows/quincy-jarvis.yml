name: Quincy · Jarvis

# Cada 30 minutos, de 7:00 a 23:59 de la Ciudad de México (UTC-6), arma el resumen hablado del negocio
# en .github/jarvis/resumen.txt. El iPhone lo lee en voz alta con un Atajo al conectarse a la camioneta.
# Para que diga visitas, guarda el secreto CF_API_TOKEN (Cloudflare → API Tokens → Account Analytics: Read).

on:
  schedule:
    - cron: "7,37 13-23 * * *"
    - cron: "7,37 0-5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quincy-jarvis
  cancel-in-progress: true

jobs:
  resumen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Armar el resumen
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python3 quincy/scripts/agentes/jarvis.py

      - name: Guardarlo
        run: |
          git add .github/jarvis/
          git diff --cached --quiet && exit 0
          git config user.name "quincy-bot"
          git config user.email "quincy-bot@users.noreply.github.com"
          git commit -q -m "Jarvis: resumen"
          for i in 1 2 3 4; do git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0; sleep $((i * 5)); done
          exit 1
