# Me Toca: publica la carpeta metoca/ en GitHub Pages (gratis en repos públicos).
# Sitio: https://alexsnri.github.io/README/metoca/
# Requisito único: Settings > Pages > Build and deployment > Source = "GitHub Actions".
name: Me Toca · publicar

on:
  push:
    branches: [main]
    paths: ["metoca/**", ".github/workflows/metoca-pages.yml"]
  workflow_run:
    workflows: ["Me Toca · tasas"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: metoca-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}metoca/
    steps:
      - uses: actions/checkout@v5

      - name: Armar el sitio (solo metoca/)
        run: |
          mkdir -p _site
          cp -r metoca _site/metoca
          rm -rf _site/metoca/scripts
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=metoca/"><link rel="canonical" href="metoca/"><title>Me Toca</title><a href="metoca/">Me Toca</a>\n' > _site/index.html
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
