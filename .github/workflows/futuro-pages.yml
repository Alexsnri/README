# Futuro Yo: publica la carpeta futuro/ en GitHub Pages (gratis en repos públicos).
# Sitio: https://alexsnri.github.io/README/futuro/
# Requisito único: Settings > Pages > Build and deployment > Source = "GitHub Actions".
name: Futuro Yo · publicar

on:
  push:
    branches: [main]
    paths: ["futuro/**", ".github/workflows/futuro-pages.yml"]
  workflow_run:
    workflows: ["Futuro Yo · tasas"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: futuro-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}futuro/
    steps:
      - uses: actions/checkout@v5

      - name: Armar el sitio (solo futuro/)
        run: |
          mkdir -p _site
          cp -r futuro _site/futuro
          rm -rf _site/futuro/scripts
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=futuro/"><link rel="canonical" href="futuro/"><title>Futuro Yo</title><a href="futuro/">Futuro Yo</a>\n' > _site/index.html
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
