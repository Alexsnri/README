<!doctype html><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Figtree:wght@500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap">
<style>
:root{--night:#07121a;--deep:#0c1d28;--line:#2c5468;--fg:#eaf3f4;--mut:#a9c0c8;--sun:#ffb547;--tide:#5ad6c8;--ok:#86e3a8;--bad:#ff8574}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:var(--night)}
#bg{position:absolute;inset:0}
#stage{position:absolute;inset:0;transform-origin:50% 45%}
.scene{position:absolute;left:84px;right:84px;top:300px;height:1020px;display:flex;flex-direction:column;justify-content:center;gap:38px}
.scene.top{justify-content:flex-start;padding-top:40px}
.chip{align-self:flex-start;font:700 32px/1 'JetBrains Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--night);background:var(--tide);padding:14px 20px;border-radius:12px}
.chip.sun{background:var(--sun)}
.h-xl{font:800 104px/1.04 Unbounded,sans-serif;color:#fff;letter-spacing:-.02em}
.h-l{font:800 78px/1.08 Unbounded,sans-serif;color:#fff;letter-spacing:-.015em}
.h-m{font:800 60px/1.12 Unbounded,sans-serif;color:#fff}
.h-xl b,.h-l b,.h-m b{color:var(--sun);font-weight:800}
.t{font:600 46px/1.3 Figtree,sans-serif;color:var(--mut)}
.t b{color:#fff}
.small{font:600 34px/1.35 Figtree,sans-serif;color:var(--mut)}
.num{font:800 230px/1 Unbounded,sans-serif;color:var(--sun);letter-spacing:-.04em}
.num.mid{font-size:170px}
.num.sm{font-size:118px;letter-spacing:-.03em}
.card{background:rgba(12,29,40,.88);border:3px solid var(--line);border-radius:40px;padding:44px 48px;display:flex;flex-direction:column;gap:22px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.row{display:flex;align-items:center;gap:26px}
.eq{font:700 58px/1.15 Figtree,sans-serif;color:#fff;display:flex;justify-content:space-between;gap:20px}
.eq span:last-child{font-family:'JetBrains Mono',monospace;color:var(--tide)}
.eq.total{border-top:4px dashed var(--line);padding-top:24px}
.eq.total span:last-child{color:var(--sun);font-size:76px}
.tick{width:74px;height:74px;border-radius:50%;background:var(--ok);display:grid;place-items:center;flex:none}
.tick svg{width:44px;height:44px}
.item{font:700 50px/1.2 Figtree,sans-serif;color:#fff}
.cta{display:flex;flex-direction:column;align-items:center;text-align:center;gap:40px}
.btn{font:800 54px/1 Figtree,sans-serif;color:#1a1206;background:var(--sun);border-radius:999px;padding:36px 64px;box-shadow:0 0 80px rgba(255,181,71,.45)}
.logo{display:flex;align-items:center;gap:26px;font:800 92px/1 Unbounded,sans-serif;color:#fff}
.logo i{width:96px;height:96px;border-radius:50%;background:radial-gradient(circle at 38% 34%,#ffd27a,#ffb547 55%,#d9672b);box-shadow:0 0 70px rgba(255,181,71,.6)}
.logo b{color:var(--sun)}
.brand{position:absolute;left:84px;top:300px;font:800 40px/1 Unbounded,sans-serif;color:#fff;display:flex;align-items:center;gap:14px;opacity:.85}
.brand i{width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 38% 34%,#ffd27a,#ffb547 55%,#d9672b)}
.brand b{color:var(--sun)}
.pill{display:inline-block;font:700 40px/1 'JetBrains Mono',monospace;padding:16px 22px;border-radius:14px;background:rgba(90,214,200,.16);color:var(--tide)}
.words span{display:inline-block;will-change:transform}
.grow{transform-origin:left center}
.growy{transform-origin:center bottom}
/*CSS*/
</style></head><body>
<canvas id="bg" width="1080" height="1920"></canvas>
<div id="stage" data-punch="/*PUNCH*/">
/*SCENES*/
</div>
<script>
const DUR = /*DUR*/;
const clamp = (x) => Math.max(0, Math.min(1, x));
const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);
const inout = (x) => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const back = (x) => { x = clamp(x); const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const money = (v, dec) => '$' + (dec ? v.toFixed(2) : Math.round(v).toString()).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
// split .words into staggered spans
document.querySelectorAll('.words').forEach((el) => {
  const t0 = +el.dataset.w || 0, step = +el.dataset.ws || 0.09; let i = 0;
  const walk = (node) => [...node.childNodes].forEach((n) => {
    if (n.nodeType === 3) { const frag = document.createDocumentFragment(); n.textContent.split(/(\s+)/).forEach((w) => { if (!w) return; if (/^\s+$/.test(w)) { frag.appendChild(document.createTextNode(w)); return; } const s = document.createElement('span'); s.textContent = w; s.dataset.in = (t0 + step * i++).toFixed(3); s.dataset.a = el.dataset.wa || 'up'; s.dataset.d = '0.38'; frag.appendChild(s); }); n.replaceWith(frag); }
    else if (n.nodeType === 1) walk(n);
  });
  walk(el);
});
// seeded background particles on an orbit
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const P = Array.from({ length: 900 }, () => ({ a: rnd() * Math.PI * 2, r: 0.75 + rnd() * 0.5, s: 0.6 + rnd() * 2.2, sun: rnd() < 0.55, sp: 0.02 + rnd() * 0.05, tw: rnd() * 6 }));
const S = Array.from({ length: 160 }, () => ({ x: rnd() * 1080, y: rnd() * 1920, s: rnd() * 2 + .5, tw: rnd() * 6 }));
const cv = document.getElementById('bg'), cx = cv.getContext('2d');
function drawBg(t) {
  const g = cx.createRadialGradient(330, 520, 40, 540, 900, 1500); g.addColorStop(0, '#16465a'); g.addColorStop(0.45, '#0b2230'); g.addColorStop(1, '#05101a');
  cx.fillStyle = g; cx.fillRect(0, 0, 1080, 1920);
  for (const s of S) { cx.globalAlpha = 0.25 + 0.25 * Math.sin(t * 1.5 + s.tw); cx.fillStyle = '#cfe9ee'; cx.fillRect(s.x, s.y, s.s, s.s); }
  cx.save(); cx.translate(760, 1560); cx.rotate(-0.32);
  for (const p of P) { const a = p.a + t * p.sp; const x = Math.cos(a) * 620 * p.r, y = Math.sin(a) * 190 * p.r; const front = Math.sin(a) > 0;
    cx.globalAlpha = (front ? 0.75 : 0.3) * (0.6 + 0.4 * Math.sin(t * 2 + p.tw)); cx.fillStyle = p.sun ? '#ffb547' : '#5ad6c8'; cx.fillRect(x, y, p.s, p.s); }
  cx.restore(); cx.globalAlpha = 1;
}
const punch = JSON.parse(document.getElementById('stage').dataset.punch || '[]');
function render(t) {
  document.querySelectorAll('[data-in]').forEach((el) => {
    const tin = +el.dataset.in, tout = el.dataset.out !== undefined ? +el.dataset.out : 1e9, a = el.dataset.a || 'up', d = +(el.dataset.d || 0.42);
    let op = 0, tr = '';
    if (t >= tin) {
      const p = (t - tin) / d, e = a === 'pop' ? back(p) : ease(p); op = clamp(p * 1.7);
      if (a === 'up') tr = `translateY(${(1 - e) * 80}px)`;
      else if (a === 'pop') tr = `scale(${0.4 + 0.6 * e})`;
      else if (a === 'left') tr = `translateX(${(1 - e) * -160}px)`;
      else if (a === 'right') tr = `translateX(${(1 - e) * 160}px)`;
      else if (a === 'drop') tr = `translateY(${(1 - e) * -160}px) rotate(${(1 - e) * -6}deg)`;
      else if (a === 'zoom') tr = `scale(${1.8 - 0.8 * e})`;
      if (el.dataset.shake && t > +el.dataset.shake) { const k = t - +el.dataset.shake; tr += ` rotate(${Math.sin(k * 40) * 3 * Math.exp(-k * 6)}deg)`; }
      if (el.dataset.pulse) { const k = t - +el.dataset.pulse; if (k > 0) tr += ` scale(${1 + 0.08 * Math.sin(Math.min(k, .5) * Math.PI * 2) * Math.exp(-k * 3)})`; }
    }
    if (t >= tout) { const e = ease((t - tout) / 0.32); op *= 1 - e; tr += ` translateY(${-60 * e}px)`; }
    el.style.opacity = op; el.style.transform = tr;
  });
  document.querySelectorAll('[data-count]').forEach((el) => {
    const [a, b] = el.dataset.count.split(',').map(Number), t0 = +el.dataset.ct, d = +(el.dataset.cd || 1.1);
    const v = a + (b - a) * ease((t - t0) / d);
    el.textContent = (el.dataset.pre || '') + (el.dataset.fmt === 'money' ? money(v) : el.dataset.fmt === 'money2' ? money(v, 2) : Math.round(v)) + (el.dataset.suf || '');
  });
  document.querySelectorAll('[data-grow]').forEach((el) => { const e = ease((t - +el.dataset.grow) / +(el.dataset.gd || 0.7)) * +(el.dataset.to || 1); el.style.transform = el.classList.contains('growy') ? `scaleY(${e})` : `scaleX(${e})`; });
  document.querySelectorAll('[data-draw]').forEach((el) => { const L = +el.dataset.len, e = ease((t - +el.dataset.draw) / +(el.dataset.dd || 0.9)) * +(el.dataset.to || 1); el.style.strokeDashoffset = L * (1 - e); });
  let s = 1; for (const pt of punch) if (t >= pt) s += 0.045 * Math.exp(-(t - pt) * 4.5) * Math.min(1, (t - pt) * 12);
  document.getElementById('stage').style.transform = `scale(${s})`;
  if (window.custom) window.custom(t);
  drawBg(t);
}
/*CUSTOM*/
window.render = render; window.DUR = DUR;
</script></body></html>
